<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Tokens aligned with atlas-secu.com / atlas-secu-pages */
    :root {
      --bg: #f4f8fa;
      --bg-soft: #eaf3f5;
      --paper: #ffffff;
      --ink: #2a3d45;
      --ink-soft: #4a6069;
      --muted: #6b818a;
      --line: #c8d8de;
      --teal: #2f8f8a;
      --teal-deep: #1f6f6b;
      --teal-soft: rgba(47, 143, 138, 0.12);
      --teal-mid: rgba(47, 143, 138, 0.28);
      --accent: #b23a3a;
      --ok: #2d7a4f;
      --display: "Outfit", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --radius: 2px;
      --radius-soft: 4px;
      --ease: cubic-bezier(0.22, 0.9, 0.28, 1);
      --shadow: 0 18px 50px rgba(42, 61, 69, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--display);
      color: var(--ink);
      line-height: 1.55;
      background:
        radial-gradient(1100px 520px at 12% -8%, rgba(47, 143, 138, 0.16), transparent 60%),
        radial-gradient(900px 480px at 92% 8%, rgba(120, 170, 190, 0.18), transparent 55%),
        linear-gradient(180deg, #fbfefe 0%, var(--bg) 45%, var(--bg-soft) 100%);
    }
    .shell {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    .brand-lockup {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin: 0 0 8px;
    }
    .hero-orb {
      position: absolute;
      width: 64px;
      height: 64px;
      left: -16px;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.95), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(47, 143, 138, 0.18), transparent 60%);
      border: 1px solid rgba(47, 143, 138, 0.18);
    }
    .brand {
      position: relative;
      z-index: 1;
      font-size: clamp(2.2rem, 5vw, 2.75rem);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0;
      line-height: 1.05;
      color: var(--ink);
    }
    .tagline {
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 1.05rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: var(--radius-soft);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin: 12px 0 6px;
    }
    input, textarea {
      width: 100%;
      background: #fbfefe;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-soft);
    }
    textarea { resize: vertical; min-height: 72px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .cta {
      appearance: none;
      border: 1.5px solid var(--teal-deep);
      border-radius: var(--radius);
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      color: #fff;
      background: var(--teal);
      box-shadow: 0 8px 24px rgba(47, 143, 138, 0.22);
      margin-top: 18px;
      transition: transform 0.2s var(--ease), background 0.2s;
    }
    .cta:hover:not(:disabled) {
      background: var(--teal-deep);
      transform: translateY(-2px);
    }
    .cta:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      border-radius: var(--radius);
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    .ghost:hover {
      border-color: var(--teal);
      color: var(--teal-deep);
      background: var(--teal-soft);
    }
    .muted { color: var(--muted); font-size: 0.92rem; }
    .status { margin-top: 14px; white-space: pre-wrap; }
    .ok { color: var(--ok); }
    .err { color: var(--accent); }
    .exports { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    code {
      font-family: var(--mono);
      font-size: 0.85em;
      background: var(--teal-soft);
      color: var(--teal-deep);
      padding: 2px 6px;
      border-radius: var(--radius);
    }
    a { color: var(--teal-deep); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand-lockup">
      <span class="hero-orb" aria-hidden="true"></span>
      <h1 class="brand">Atlas</h1>
    </div>
    <p class="tagline">Scan passif</p>

    <div class="card">
      <div class="row">
        <span class="muted">API</span>
        <code id="apiBase">http://127.0.0.1:3001</code>
        <button type="button" class="ghost" id="startApiBtn">Demarrer l'API</button>
        <button type="button" class="ghost" id="pingBtn">Tester</button>
        <span id="apiHealth" class="muted"></span>
      </div>
      <input id="apiUrl" type="hidden" value="http://127.0.0.1:3001" />
    </div>

    <div class="card">
      <label for="email">Compte</label>
      <input id="email" value="owner@demo.atlas.local" autocomplete="username" />
      <label for="password">Mot de passe</label>
      <input id="password" type="password" value="atlas-demo" autocomplete="current-password" />

      <label for="target">FQDN (*.pragma-serve.com, *.pragma-cloud.com, *.pragma.mc)</label>
      <input id="target" value="pragma-serve.com" autocomplete="off" />

      <label class="mode-toggle" for="testResponsibility" style="display:flex;gap:10px;align-items:flex-start;margin:14px 0 8px;cursor:pointer">
        <input id="testResponsibility" type="checkbox" style="margin-top:4px;width:auto" />
        <span>Je prends la responsabilité de ce scan s'il s'avère non autorisé.</span>
      </label>

      <div class="row" style="margin-top:18px;gap:10px;align-items:stretch">
        <button type="button" class="cta" id="scanBtn" style="margin-top:0" disabled>Scan</button>
      </div>
      <div id="status" class="status muted" role="status"></div>
      <div id="exports" class="exports" hidden></div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const exportsEl = $("exports");
    const TEST_RESPONSIBILITY_LABEL =
      "Je prends la responsabilité de ce scan s'il s'avère non autorisé.";
    const ROE_SCOPE_LABEL =
      "*.pragma-serve.com, *.pragma-cloud.com, *.pragma.mc";
    const ROE_SCOPE_PATTERNS = [
      "*.pragma-serve.com",
      "*.pragma-cloud.com",
      "*.pragma.mc",
    ];
    /* Apexes in RoE §3 not covered by *.apex — policy-guard rejects bare cloud/mc. */
    const ROE_EXPLICIT_APEXES = ["pragma-serve.com"];
    /** Parité apps/client authorizedLaunch — deep-link actions only. */
    const AUTHORIZED_ACTIONS = ["recon", "scan", "vuln", "osint"];
    const AUTHORIZED_ACTION_LABELS = {
      recon: "Reconnaissance",
      scan: "Scan",
      vuln: "Évaluation de vulnérabilités",
      osint: "OSINT",
    };
    let token = null;
    let lastMissionId = null;

    /** Fail-closed: même RoE que apps/client authorizedLaunch. */
    function isAuthorizedRoeHost(host) {
      const h = normalizeLaunchHost(host);
      if (!h || h.includes(" ") || h.includes("..") || h.includes(":")) {
        return false;
      }
      if (ROE_EXPLICIT_APEXES.includes(h)) return true;
      return ROE_SCOPE_PATTERNS.some((pattern) => {
        const suffix = pattern.slice(1);
        return h.endsWith(suffix) && h.length > suffix.length;
      });
    }

    function normalizeLaunchHost(value) {
      const raw = String(value || "").trim();
      try {
        if (raw.includes("://")) {
          return new URL(raw).hostname.toLowerCase().replace(/\.$/, "");
        }
      } catch {
        /* fallthrough */
      }
      let host = raw.toLowerCase().replace(/\.$/, "").split("/")[0] || "";
      if (host.includes(":") && !host.includes("::")) {
        host = host.split(":")[0] || host;
      }
      return host;
    }

    function isAuthorizedAction(value) {
      return AUTHORIZED_ACTIONS.indexOf(String(value || "").trim()) !== -1;
    }

    /**
     * Deep-link Pages / atlas-secu.com → shell Scan (?action=&host=#scanner).
     * Prefill FQDN only when action (if set) + host are authorized; else status err.
     */
    function applyLaunchFromQuery(search) {
      const q = new URLSearchParams(
        String(search || "").startsWith("?")
          ? String(search).slice(1)
          : String(search || ""),
      );
      const action = (q.get("action") || "").trim();
      const hostRaw = (q.get("host") || "").trim();
      if (!action && !hostRaw) return;
      if (action && !isAuthorizedAction(action)) {
        setStatus(
          "Action « " + action + " » non autorisée — utiliser recon|scan|vuln|osint.",
          "err",
        );
        return;
      }
      const actionLabel = AUTHORIZED_ACTION_LABELS[action] || action;
      if (!hostRaw) {
        setStatus(
          "Deep-link : action « " + actionLabel + " » — renseignez un FQDN RoE.",
          "muted",
        );
        return;
      }
      const host = normalizeLaunchHost(hostRaw);
      if (!isAuthorizedRoeHost(host)) {
        setStatus(
          "Cible « " + hostRaw + " » hors RoE (" + ROE_SCOPE_LABEL + ").",
          "err",
        );
        return;
      }
      $("target").value = host;
      setStatus(
        (action ? "Deep-link « " + actionLabel + " » · " : "Deep-link · ") + host,
        "muted",
      );
    }

    function syncScanEnabled() {
      $("scanBtn").disabled = !$("testResponsibility").checked;
    }

    function api() {
      return ($("apiUrl").value || "http://127.0.0.1:3001").replace(/\/$/, "");
    }

    function setStatus(text, cls) {
      statusEl.className = "status " + (cls || "muted");
      statusEl.textContent = text;
    }

    async function apiJson(path, opts = {}) {
      const headers = Object.assign(
        { "Content-Type": "application/json" },
        opts.headers || {},
      );
      if (token) headers.Authorization = "Bearer " + token;
      const res = await fetch(api() + path, Object.assign({}, opts, { headers }));
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { message: text }; }
      if (!res.ok) {
        const msg = (data && (data.message || data.error)) || ("HTTP " + res.status);
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }
      return data;
    }

    async function ping() {
      $("apiBase").textContent = api();
      try {
        const res = await fetch(api() + "/v1/health");
        $("apiHealth").textContent = res.ok ? "OK" : "HTTP " + res.status;
        $("apiHealth").className = res.ok ? "ok" : "err";
        return res.ok;
      } catch (e) {
        $("apiHealth").textContent = "hors ligne";
        $("apiHealth").className = "err";
        return false;
      }
    }

    async function startApi() {
      $("startApiBtn").disabled = true;
      setStatus("Demarrage API…");
      try {
        const res = await fetch("http://127.0.0.1:17865/start-api", { method: "POST" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) {
          const err = (data && (data.error || data.message)) || ("HTTP " + res.status);
          const hint = data && data.hint ? String(data.hint) : "";
          const looked = Array.isArray(data && data.lookedIn)
            ? data.lookedIn.slice(0, 6).join(" · ")
            : (data && data.lookedIn ? String(data.lookedIn) : "");
          let line = String(err);
          if (hint) line += "\n" + hint;
          if (looked) line += "\nCherché : " + looked;
          setStatus(line, "err");
          return;
        }
        setStatus("Attente health…");
        for (let i = 0; i < 30; i++) {
          await new Promise((r) => setTimeout(r, 4000));
          if (await ping()) {
            setStatus("API OK", "ok");
            return;
          }
          setStatus("Demarrage… " + (i + 1) + "/30");
        }
        setStatus("API toujours hors ligne.", "err");
      } catch (e) {
        setStatus(e instanceof Error ? e.message : String(e), "err");
      } finally {
        $("startApiBtn").disabled = false;
      }
    }

    async function ensureLogin() {
      if (token) return token;
      const login = await apiJson("/v1/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email: $("email").value.trim(),
          password: $("password").value,
        }),
      });
      token = login.accessToken;
      if (!token) throw new Error("Pas de jeton — vérifiez les identifiants");
      return token;
    }

    async function ensureConnector() {
      const grants = await apiJson("/v1/connectors");
      const active = Array.isArray(grants) && grants.some(
        (g) => g.connectorId === "web.passive.presence" && g.status === "active",
      );
      if (!active) {
        await apiJson("/v1/connectors/connect", {
          method: "POST",
          body: JSON.stringify({ connectorId: "web.passive.presence" }),
        });
      }
    }

    async function ensureAsset(host) {
      const assets = await apiJson("/v1/assets");
      const normalized = host.trim().toLowerCase().replace(/\.$/, "");
      const existing = (assets || []).find(
        (a) => a.normalized === normalized || a.value.toLowerCase() === normalized,
      );
      if (existing) return existing;
      return apiJson("/v1/assets", {
        method: "POST",
        body: JSON.stringify({ type: "domain", value: normalized, synthetic: false }),
      });
    }

    function canExecute(status) {
      return status === "A_APPROVED" || status === "A_SKIPPED_DEMO";
    }

    async function pollMission(id, attempts) {
      for (let i = 0; i < attempts; i++) {
        const m = await apiJson("/v1/missions/" + id);
        const reports = (m.reports && m.reports.length) || 0;
        if (
          m.status === "REPORT_AVAILABLE" ||
          m.status === "BLOCKED" ||
          m.status === "FAILED" ||
          m.status === "CANCELLED" ||
          m.status === "CLOSED" ||
          reports > 0
        ) {
          return m;
        }
        setStatus(m.status + "… " + (i + 1) + "/" + attempts);
        await new Promise((r) => setTimeout(r, 4000));
      }
      return apiJson("/v1/missions/" + id);
    }

    async function showExports(missionId) {
      const m = await apiJson("/v1/missions/" + missionId);
      const report = (m.reports && m.reports[0]) || null;
      if (!report) {
        exportsEl.hidden = true;
        return;
      }
      exportsEl.hidden = false;
      exportsEl.innerHTML = "";
      for (const fmt of ["json", "csv", "pdf"]) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ghost";
        btn.textContent = fmt.toUpperCase();
        btn.onclick = async () => {
          const res = await fetch(
            api() + "/v1/missions/" + missionId + "/reports/" + report.id + "/export?format=" + fmt,
            { headers: { Authorization: "Bearer " + token } },
          );
          if (!res.ok) throw new Error("Export " + fmt + " échoué (" + res.status + ")");
          const blob = await res.blob();
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "atlas-report-" + report.id + "." + fmt;
          a.click();
          URL.revokeObjectURL(a.href);
        };
        exportsEl.appendChild(btn);
      }
    }

    async function executeAndExport(missionId) {
      setStatus("Execution…");
      const run = await apiJson("/v1/missions/" + missionId + "/execute", { method: "POST" });
      if (run.gate && run.gate.decision === "REJECT") {
        setStatus(run.gate.code + ": " + run.gate.reason, "err");
        return;
      }
      const done = await pollMission(missionId, 45);
      if (done.status === "REPORT_AVAILABLE" || (done.reports && done.reports.length)) {
        setStatus("OK — " + done.status, "ok");
        await showExports(missionId);
        return;
      }
      setStatus(
        done.status + (done.blockedReason ? " — " + done.blockedReason : ""),
        "err",
      );
    }

    async function runScan() {
      const target = $("target").value.trim().toLowerCase().replace(/\.$/, "");
      if (!$("testResponsibility").checked) {
        setStatus("Cochez « " + TEST_RESPONSIBILITY_LABEL + " » avant le scan.", "err");
        return;
      }
      if (!target || target.length < 3) {
        setStatus("Cible FQDN requise (" + ROE_SCOPE_LABEL + ").", "err");
        return;
      }
      if (!isAuthorizedRoeHost(target)) {
        setStatus("Cible hors RoE (" + ROE_SCOPE_LABEL + ").", "err");
        return;
      }

      $("scanBtn").disabled = true;
      exportsEl.hidden = true;
      try {
        if (!(await ping())) {
          setStatus("API hors ligne — Demarrer l'API.", "err");
          return;
        }

        setStatus("Connexion…");
        await ensureLogin();

        setStatus("Connecteur…");
        await ensureConnector();

        setStatus("Actif…");
        const asset = await ensureAsset(target);

        setStatus("Mission…");
        const mission = await apiJson("/v1/missions", {
          method: "POST",
          body: JSON.stringify({
            title: "Presence web",
            uxNeedIds: ["web_presence"],
            assetIds: [asset.id],
            synthetic: false,
            exclusions: [],
            notes: "Responsabilite operateur",
          }),
        });
        lastMissionId = mission.id;

        setStatus("Responsabilite…");
        const attached = await apiJson(
          "/v1/missions/" + mission.id + "/owner-authorization",
          {
            method: "POST",
            body: JSON.stringify({
              signerLabel: $("email").value.trim() || "Atlas Scan",
              testResponsibilityAccepted: true,
              testResponsibilityLabel: TEST_RESPONSIBILITY_LABEL,
            }),
          },
        );

        const status = String(attached.status || mission.status || "?");
        setStatus(status);
        if (!canExecute(status)) {
          setStatus("Refus: " + status + (attached.blockedReason ? " — " + attached.blockedReason : ""), "err");
          return;
        }

        await executeAndExport(mission.id);
      } catch (e) {
        setStatus(e instanceof Error ? e.message : String(e), "err");
      } finally {
        syncScanEnabled();
      }
    }

    $("pingBtn").onclick = () => void ping();
    $("startApiBtn").onclick = () => void startApi();
    $("apiUrl").onchange = () => { $("apiBase").textContent = api(); };
    $("testResponsibility").onchange = () => syncScanEnabled();
    $("scanBtn").onclick = () => void runScan();
    syncScanEnabled();
    applyLaunchFromQuery(location.search);
    void ping();
  </script>
</body>
</html>
