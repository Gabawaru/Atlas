<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas Capture Chat — Connexion</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-body">
  <main class="login-shell">
    <p class="brand">Atlas Capture Chat</p>
    <h1>Connexion</h1>
    <p class="hint">Entrez votre email Atlas uniquement. Pas de mot de passe.</p>
    <form id="login-form" class="login-form">
      <label>
        Email Atlas
        <input
          id="email"
          type="email"
          name="email"
          autocomplete="username"
          required
          placeholder="prenom@atlas-secu.com"
        />
      </label>
      <button type="submit">Entrer</button>
    </form>
    <p id="login-error" class="error" hidden></p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
