# Publish Atlas-Setup.exe to GitHub Releases (Atlas download chain).
# Ship asset name expected by /api/atlas/download consumers.
name: Release Atlas-Setup

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: upload Atlas-Setup.exe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PE ship asset
        run: |
          set -euo pipefail
          ASSET=remote-work/offline-installer/bin/Atlas-Setup.exe
          test -f "$ASSET"
          # MZ header
          python3 - <<'PY'
          from pathlib import Path
          p = Path("remote-work/offline-installer/bin/Atlas-Setup.exe")
          data = p.read_bytes()
          assert data[:2] == b"MZ", data[:2]
          print(f"ok size={p.stat().st_size} sha256={__import__('hashlib').sha256(data).hexdigest()}")
          PY

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release + upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          ASSET=remote-work/offline-installer/bin/Atlas-Setup.exe
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Atlas Setup ${TAG}" \
              --notes "Windows installer \`Atlas-Setup.exe\` for Atlas download (\`/api/atlas/download\`)."
          fi
          gh release view "$TAG" --json tagName,assets,url --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
