# Publish Atlas-Setup.exe to GitHub Releases (Atlas download chain).
# Ship asset name expected by /api/atlas/download consumers.
name: Release Atlas-Setup

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: upload Atlas-Setup.exe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify PE + NSIS version lock + /S guards
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          ASSET=remote-work/offline-installer/bin/Atlas-Setup.exe
          NSI=remote-work/atlas-v1/installer/Atlas.nsi
          test -f "$ASSET"
          test -f "$NSI"
          # MZ + min size (stub PEs are ~tens of KB; ship is ~2 MiB)
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ["TAG"].lstrip("v")
          assert re.fullmatch(r"\d+\.\d+\.\d+", tag), tag
          nsi = Path("remote-work/atlas-v1/installer/Atlas.nsi").read_text(encoding="utf-8")
          m = re.search(r'!define PRODUCT_VERSION "(\d+\.\d+\.\d+)"', nsi)
          assert m, "PRODUCT_VERSION missing"
          assert m.group(1) == tag, f"NSIS {m.group(1)} != tag {tag}"
          assert "IfSilent skipUninstDesktop" in nsi, "IfSilent MessageBox guard missing"
          assert "SetAutoClose true" in nsi, "SetAutoClose missing"
          assert "MUI_FINISHPAGE_RUN_NOTCHECKED" in nsi, "silent auto-run guard missing"
          p = Path("remote-work/offline-installer/bin/Atlas-Setup.exe")
          data = p.read_bytes()
          assert data[:2] == b"MZ", data[:2]
          assert p.stat().st_size >= 2_000_000, p.stat().st_size
          print(f"ok tag=v{tag} size={p.stat().st_size} sha256={__import__('hashlib').sha256(data).hexdigest()}")
          PY

      - name: Create or update release + upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          ASSET=remote-work/offline-installer/bin/Atlas-Setup.exe
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Atlas Setup ${TAG}" \
              --notes "Windows installer \`Atlas-Setup.exe\` for Atlas download (\`/api/atlas/download\`)."
          fi
          gh release view "$TAG" --json tagName,assets,url --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
