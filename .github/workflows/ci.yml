# Atlas MVP — CI légère (unit + acceptation)
# Services : Postgres 16 + Redis 7 (BullMQ). Pas de features produit ici.
name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit + acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_only
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # migrate/seed : atlas (superuser service). Tests RLS : atlas_app (migration).
      DATABASE_URL: postgresql://atlas:atlas_dev_only@localhost:5432/atlas?schema=public
      ATLAS_RLS_DATABASE_URL: postgresql://atlas_app:atlas_dev_only@localhost:5432/atlas?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-not-a-real-secret
      ATLAS_FORCE_MOCK_NETWORK: "true"
      ATLAS_ENV: ci
      ATLAS_SYNTHETIC_DEMO: "true"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @atlas/shared build
          pnpm --filter @atlas/policy-guard build

      - name: Prisma generate + migrate
        run: |
          pnpm db:generate
          pnpm db:migrate

      - name: Seed (données FICTIVES pour AC isolation)
        run: pnpm db:seed

      - name: Unit tests
        run: pnpm test:unit

      - name: Acceptance tests
        run: pnpm test:acceptance

      - name: Client packaging smoke
        run: pnpm client:smoke
