# Atlas MVP — CI légère (unit + acceptation)
# Musk étape 5 : automatiser en dernier — cache uniquement, pas de feature produit.
name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap fail-closed hygiene: internship/stage personal paths must not reappear.
  repo-hygiene:
    name: no stage/personal paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gate STAGE.md / docs/stage / convention personal
        run: bash scripts/check-no-stage-personal.sh
      - name: Unix install Darwin PATH self-test
        run: bash scripts/unix/install-atlas-prereqs.sh --self-test

  test:
    name: unit + acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repo-hygiene

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_only
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # migrate/seed : atlas (superuser service). Tests RLS : atlas_app (migration).
      DATABASE_URL: postgresql://atlas:atlas_dev_only@localhost:5432/atlas?schema=public
      ATLAS_RLS_DATABASE_URL: postgresql://atlas_app:atlas_dev_only@localhost:5432/atlas?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-not-a-real-secret
      ATLAS_FORCE_MOCK_NETWORK: "true"
      ATLAS_VULN_FEEDS_MODE: "fixture"
      ATLAS_ENV: ci
      ATLAS_SYNTHETIC_DEMO: "true"
      # Stub chat signed-authorization (pas Pragma Sign) — démo CI
      ATLAS_CHAT_SIGNATURE_STUB: "signed"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('apps/api/prisma/schema.prisma', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Cache shared package dist
        id: cache-pkg-dist
        uses: actions/cache@v4
        with:
          path: |
            packages/shared/dist
            packages/policy-guard/dist
          key: ${{ runner.os }}-pkg-dist-${{ hashFiles('packages/shared/src/**', 'packages/policy-guard/src/**', 'packages/*/package.json', 'packages/*/tsconfig.json') }}

      - name: Build shared packages
        if: steps.cache-pkg-dist.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @atlas/shared build
          pnpm --filter @atlas/policy-guard build

      - name: Prisma generate + migrate
        run: |
          pnpm db:generate
          pnpm db:migrate

      - name: Seed (données FICTIVES pour AC isolation)
        run: pnpm db:seed

      - name: Unit tests
        run: pnpm test:unit

      - name: Acceptance tests
        run: pnpm test:acceptance

      - name: Client packaging smoke
        run: pnpm client:smoke

      # Musk étape 5 — après harden execute-path. Fail-closed critique différé :
      # admin Next 14.x a encore des advisories critiques → upgrade Next d'abord
      # (TODO humain/eng), puis retirer continue-on-error.
      - name: Audit critical deps (informational)
        continue-on-error: true
        run: pnpm audit --audit-level=critical
